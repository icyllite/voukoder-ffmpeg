name: libfdkaac

inputs:
  refId:
    type: string
    required: true
  config:
    type: string
    required: true
  system:
    type: string
    required: false
    default: 'windows-2022'

runs:
  using: "composite"
  steps:
  - name: Restore cached build
    id: cache
    uses: actions/cache@v4
    with:
      path: dist
      key: libfdkaac-${{ inputs.system }}-${{ inputs.config }}-${{ inputs.refId }}-v1-${{ hashFiles('.github/actions/libfdkaac/action.yml') }}
  - name: Set up GIT
    if: steps.cache.outputs.cache-hit != 'true'
    shell: cmd
    run: |
      git config --global core.autocrlf false
      git config --global core.eol lf
  - name: Checkout FDK AAC
    if: steps.cache.outputs.cache-hit != 'true'
    uses: actions/checkout@v3
    with:
      repository: mstorsjo/fdk-aac
      ref: ${{ inputs.refId }}
      path: fdkaac
  - name: Set up MSYS2
    if: steps.cache.outputs.cache-hit != 'true'
    uses: msys2/setup-msys2@v2
    with:
      install: base-devel binutils autotools automake mingw-w64-x86_64-cmake nasm
      path-type: inherit
  - name: Build FDK AAC
    if: steps.cache.outputs.cache-hit != 'true'
    shell: cmd
    env:
      vsPath: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\
      cFlags: ${{ inputs.config == 'release' && '-MD' || '-MDd' }}
    run: |
      call "${{ env.vsPath }}VC\Auxiliary\Build\vcvars64.bat"
      md build dist
      D:\a\_temp\setup-msys2\msys2.cmd -c 'cd fdkaac ; autoreconf -fiv ; CC=cl.exe CXX=cl.exe CXXFLAGS=${{ env.cFlags }} ./configure --prefix=$(realpath ../build) --disable-shared --enable-static ; make -j 2 ; make install ; cd ../build ; tar czf ../dist/libfdkaac.tgz *'
  - name: Publish artifact
    uses: actions/upload-artifact@v4
    with:
      name: libfdkaac-${{ runner.os }}-${{ inputs.config }}
      path: dist/libfdkaac.tgz
